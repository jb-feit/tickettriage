# Week 1: only the database (Postgres + pgvector). api / worker / dashboard arrive in later weeks.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickettriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tickettriage}
    ports:
      - "127.0.0.1:5432:5432"   # local only; never expose this publicly
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tickettriage}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
